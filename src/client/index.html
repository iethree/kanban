<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban</title>
    <meta name="description" content="Simple, real-time shared kanban boards. No sign-up." />
    <meta name="color-scheme" content="light dark" />
    <!-- For AI agents: how to use this app over HTTP. Project pages swap in their own links. -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="Instructions for AI agents" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='1' y='1' width='18' height='18' rx='5' fill='%231a1a19'/%3E%3Crect x='5' y='5' width='2.6' height='10' rx='1.3' fill='white'/%3E%3Crect x='8.7' y='5' width='2.6' height='6.5' rx='1.3' fill='white'/%3E%3Crect x='12.4' y='5' width='2.6' height='8' rx='1.3' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("kanban.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown to clients that don't run JavaScript; React replaces it in browsers. -->
      <section
        id="agent-hint"
        style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0"
      >
        <h1>Kanban</h1>
        <p>
          Real-time shared kanban boards. If you are an AI agent or a script, you don't need a browser: read
          <a href="/llms.txt">/llms.txt</a> for the HTTP API.
        </p>
      </section>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
