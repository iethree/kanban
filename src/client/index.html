<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban</title>
    <meta name="description" content="Simple, real-time shared kanban boards. No sign-up." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='1' y='1' width='18' height='18' rx='5' fill='%231a1a19'/%3E%3Crect x='5' y='5' width='2.6' height='10' rx='1.3' fill='white'/%3E%3Crect x='8.7' y='5' width='2.6' height='6.5' rx='1.3' fill='white'/%3E%3Crect x='12.4' y='5' width='2.6' height='8' rx='1.3' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("kanban.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
